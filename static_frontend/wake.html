<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparando acesso | Resenha Morumbi</title><meta name="description" content="Jogos, shows e experiências no Camarote Resenha Morumbi."><meta name="theme-color" content="#101112"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style.css"><style>.bridge-status{max-width:560px;color:#d0d0d2}.bridge-loader{display:inline-flex;align-items:center;gap:10px;font-size:.85rem;color:#fff}.bridge-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:bridgePulse 1.1s ease-in-out infinite}.bridge-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}@keyframes bridgePulse{50%{opacity:.25;transform:scale(.8)}}.bridge-note{font-size:.78rem;color:#b9bcc2;margin-top:13px}</style></head><body><header class="site-header"><div class="container nav-inner"><a href="/" class="brand"><span class="brand-word">Resenha<span class="brand-dot">.</span></span><span class="brand-place">MORUMBI</span></a></div></header><main id="main"><section class="hero"><article class="hero-slide"><img src="/images/morumbi.jpg" alt="MorumBIS" class="hero-image"><div class="hero-shade"></div><div class="container hero-inner"><div class="eyebrow light-eyebrow"><span></span>ACESSO SEGURO</div><h1>Preparando<br>seu acesso.</h1><p class="bridge-status" data-wake-status>Estamos iniciando a área segura. Você será redirecionado automaticamente.</p><div class="bridge-loader"><span class="bridge-dot"></span><span>Conectando ao sistema</span></div><div class="bridge-actions"><a class="btn btn-light" href="/">Voltar ao site</a></div></div></article></section></main><script>'use strict';const BACKEND='https://resenha-morumbi.onrender.com';const params=new URLSearchParams(location.search);let to=params.get('to')||'/';if(!to.startsWith('/')||to.startsWith('//'))to='/';const status=document.querySelector('[data-wake-status]');async function wake(){for(let i=0;i<35;i++){try{const r=await fetch(BACKEND+'/api/public/ping.json',{cache:'no-store',mode:'cors'});if(r.ok){const data=await r.json();if(data.ok){location.replace(BACKEND+to);return}}}catch{}if(status&&i>2)status.textContent='O sistema está iniciando. Normalmente isso leva menos de um minuto.';await new Promise(r=>setTimeout(r,2000))}if(status)status.textContent='Não foi possível abrir a área segura agora. Tente novamente em instantes.'}wake();</script></body></html>
