services:
  - type: web
    name: resenha-morumbi
    runtime: python
    plan: free
    region: virginia
    repo: https://github.com/ZenithWe/camarote-resenha-morumbi
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_site && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    healthCheckPath: /saude/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resenha-morumbi-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TRUST_PROXY
        value: "1"
      - key: PERSISTENT_MEDIA
        value: "1"
